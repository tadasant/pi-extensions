name: Release

# Publishes the packages to npm.
#
# Requires an `NPM_TOKEN` repository secret (an npm automation token with publish
# rights on the @tadasant scope). If it is missing, the job below fails fast with
# that message rather than half-publishing. CI (build, lint, unit, e2e) does not
# depend on the secret in any way.
#
# Triggered by pushing a tag like `v0.1.0`, or manually with a dry-run option.
#
# `verify` runs on the shared self-hosted runner pool, like ci.yml and like the
# release workflows in tadasant/zimmer and tadasant/strad. It needs no fork guard:
# neither trigger here (a tag push, a manual dispatch) can be raised by an outside
# contributor, so fork code cannot reach the box through this workflow. `publish`
# stays on ubuntu-latest — see the comment on that job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # The runner purges RUNNER_TEMP per job; a persistent box would otherwise
      # accumulate the e2e suite's mkdtemp scratch directories under /tmp forever.
      - name: Point TMPDIR at the per-job temp dir
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:pin
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Cache the pinned Pi install
        uses: actions/cache@v4
        with:
          path: .e2e-cache
          key: pi-cli-${{ hashFiles('e2e/pi-version.json') }}
      - run: npm run pi:install
      - run: npm run test:e2e

  publish:
    name: Publish to npm
    needs: verify
    # Deliberately ubuntu-latest, not self-hosted: `npm publish --provenance` mints a
    # SLSA attestation from the GitHub OIDC token, and npm's provenance documentation
    # requires a cloud-hosted runner for it. A release job that runs a couple of
    # times a month is not worth the runner minutes anyway.
    runs-on: ubuntu-latest
    environment: npm-publish
    # `id-token: write` is what `npm publish --provenance` needs to mint its
    # attestation. Granted here, to this job only, rather than workflow-wide: the
    # `verify` job above runs arbitrary test subprocesses on a shared box and has no
    # business holding an OIDC-minting permission.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Require the npm credential
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not configured on this repository, so nothing can be published."
            echo "::error::Create an npm automation token with publish rights on the @tadasant scope and add it as the NPM_TOKEN repository secret."
            exit 1
          fi
      - name: Check the tag matches the package versions
        if: ${{ github.event_name == 'push' }}
        run: node scripts/check-release-tag.mjs "${GITHUB_REF_NAME}"
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run pack:dry-run
      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace @tadasant/pi-hooks --provenance --access public
          npm publish --workspace @tadasant/pi-plugins --provenance --access public
