name: CI

# Build, lint, and test on every pull request and every push to main.
#
# The e2e job is the point of this repository's test strategy: it downloads the
# pinned Pi CLI and drives the real binary against a simulated LLM on localhost.
# It needs no secrets and makes no model-provider network calls.
#
# Runs on the shared self-hosted GitHub Actions runner pool (label `self-hosted`,
# runners `tadasant-pi-extensions-ci-*`) that this repo registers against, the same
# arrangement as tadasant/zimmer and tadasant/strad. Two things follow from that:
#
#   - This repo is PUBLIC, and a self-hosted runner on a public repo would otherwise
#     execute any stranger's fork-PR code on a box we do not own. So every job that
#     checks out code carries the fork guard:
#
#       if: github.event_name == 'push'
#           || github.event.pull_request.head.repo.full_name == github.repository
#
#     A push, or a PR from a branch in this repo, runs. A PR from a fork SKIPS these
#     jobs -- fork code never reaches the box -- and `all-checks-pass` below, which
#     has no checkout step and no guard, lets the skips through so the one required
#     check still reports. Together with the repo's fork-PR approval policy
#     (`all_external_contributors`, a repo setting, not a workflow), this is the
#     condition under which the runner owner serves a public repo at all. Do not
#     remove the guard from a job, and do not add a checkout job without it.
#
#   - Two jobs from this repo can run concurrently on the same box, each in its own
#     runner work directory. Nothing here may write to a shared absolute path; the
#     e2e cache (`.e2e-cache`) is workspace-relative and the harness uses mkdtemp.
#
# If you fork this repo, switch the jobs back to `ubuntu-latest`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint and typecheck
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify the Pi version pin is exact and consistent
        run: npm run check:pin
      - name: Biome
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit tests
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E against pinned Pi
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache the pinned Pi install
        uses: actions/cache@v4
        with:
          path: .e2e-cache
          key: pi-cli-${{ hashFiles('e2e/pi-version.json') }}
      - name: Download the pinned Pi CLI
        run: npm run pi:install
      - name: Report the Pi version actually under test
        run: node .e2e-cache/pi/$(node -p "require('./e2e/pi-version.json').version")/node_modules/@earendil-works/pi-coding-agent/dist/cli.js --version
        env:
          PI_OFFLINE: "1"
          PI_SKIP_VERSION_CHECK: "1"
      - run: npm run test:e2e

  package:
    name: Publish dry run
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Proves the tarballs are well-formed without needing NPM_TOKEN. Publishing
      # itself lives in release.yml and is gated on that secret.
      - run: npm run pack:dry-run

  # Single aggregate gate for the branch ruleset. `all-checks-pass` is the one required
  # status check on `main`, instead of enumerating every job above — so adding or renaming
  # a job never means editing repository settings. It `needs:` every job and re-derives a
  # pass/fail from their results.
  #
  # Three properties make it a correct gate:
  #   1. `if: ${{ !cancelled() }}` rather than `always()`: a plain `needs:` job is *skipped*
  #      when a dependency fails, which would leave the required check perpetually
  #      pending — but `always()` would also run this on superseded runs, which
  #      `cancel-in-progress` cancels, turning a cancelled run into a failed one and
  #      tripping the CI-failure alert, which deliberately stays quiet on `cancelled`.
  #   2. It fails on any dependency that reported `failure` or `cancelled`.
  #   3. `skipped` dependencies do NOT fail it and are NOT counted as passes: every job
  #      above carries the fork guard and reports `skipped` on a fork PR, so a fork PR
  #      sees everything skip and this gate go green. It carries no fork guard itself,
  #      which is fine precisely because it has NO checkout step — a fork PR never
  #      executes fork code here. Keep it that way.
  all-checks-pass:
    name: all-checks-pass
    if: ${{ !cancelled() }}
    runs-on: self-hosted
    needs:
      - lint
      - unit
      - e2e
      - package
    steps:
      - name: Verify no required check failed or was cancelled
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::One or more required CI checks failed or were cancelled."
            echo "Results: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "All required CI checks passed (skipped fork-guarded jobs are allowed)."
          echo "Results: ${{ join(needs.*.result, ', ') }}"
